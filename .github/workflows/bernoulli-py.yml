# CI for the Python package in bernoulli-py/ (distribution bernoulli-types,
# import name bernoulli). The commands are the ones AGENTS.md specifies for
# local validation, run in a fresh uv environment with the [dev] extra.
name: bernoulli-py

on:
  push:
    paths:
      - "bernoulli-py/**"
      - ".github/workflows/bernoulli-py.yml"
  pull_request:
    paths:
      - "bernoulli-py/**"
      - ".github/workflows/bernoulli-py.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bernoulli-py-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bernoulli-py

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Create the environment with the dev extra
        run: |
          uv venv --python "${{ matrix.python-version }}"
          VIRTUAL_ENV="$PWD/.venv" uv pip install -e ".[dev]"

      - name: Tests with branch coverage
        run: .venv/bin/python -m pytest --cov=bernoulli --cov-branch --cov-report=term-missing

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Type check
        run: .venv/bin/mypy

  package:
    name: build and check distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Build the sdist and wheel
        run: uv build --out-dir dist

      - name: Check the distribution metadata
        run: uvx twine check --strict dist/*

      - name: Run the README examples against the installed wheel
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/wheel-env"
          VIRTUAL_ENV="$RUNNER_TEMP/wheel-env" uv pip install dist/*.whl
          cp README.md "$RUNNER_TEMP/README.md"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m doctest README.md
