[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bernoulli-types"
version = "0.2.0"
description = "Random approximate types: a Bernoulli framework for principled error propagation across data structures and algorithms"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Alexander Towell", email = "lex@metafunctor.com" }
]
requires-python = ">=3.11"
keywords = [
  "bernoulli",
  "bloom-filter",
  "perfect-hash-filter",
  "approximate-data-structures",
  "probabilistic-data-structures",
  "ribbon-retrieval",
  "type-theory",
  "error-propagation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
c = [
  # Phase 2+: cffi-backed C primitives (Bloom filter, hashing, fingerprint storage)
  "cffi >= 1.16"
]
numerics = [
  "numpy >= 1.26"
]
dev = [
  "pytest >= 8.0",
  "pytest-cov >= 5.0",
  "ruff >= 0.6",
  "mypy >= 1.10",
  "hypothesis >= 6.100"
]
notebooks = [
  "jupyter >= 1.0",
  "matplotlib >= 3.8",
  "numpy >= 1.26",
  "scipy >= 1.11",
  "sympy >= 1.12"
]

[project.urls]
Homepage = "https://github.com/queelius/bernoulli"
Documentation = "https://github.com/queelius/bernoulli/tree/main/book"
Source = "https://github.com/queelius/bernoulli/tree/main/bernoulli-py"
Issues = "https://github.com/queelius/bernoulli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bernoulli"]

[tool.hatch.build.targets.sdist]
include = [
  "src/bernoulli",
  "c",
  "tests",
  "README.md",
  "LICENSE",
  "PHASING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["N802", "N803"]  # framework uses uppercase NOT/AND/OR by intent

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bernoulli"]
