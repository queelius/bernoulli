[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "bernoulli-types"
dynamic = ["version"]
description = "Approximate membership, perfect hashing, retrieval and sketches under one two-rate (false-positive, false-negative) error model"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alexander Towell", email = "lex@metafunctor.com" }
]
requires-python = ">=3.11"
keywords = [
  "approximate membership",
  "Bloom filter",
  "perfect hashing",
  "probabilistic data structures",
  "minimal perfect hash",
  "retrieval data structure",
  "false positive rate",
  "error propagation",
  "Count-Min sketch",
  "HyperLogLog",
  "MinHash",
  "randomized response",
  "Bernoulli types"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest >= 8.0",
  "pytest-cov >= 5.0",
  "ruff >= 0.6",
  "mypy >= 1.10",
  "hypothesis >= 6.100"
]
notebooks = [
  "jupyter >= 1.0",
  "matplotlib >= 3.8",
  "numpy >= 1.26",
  "scipy >= 1.11",
  "sympy >= 1.12"
]

[project.urls]
Homepage = "https://metafunctor.com/research/bernoulli/"
Documentation = "https://metafunctor.com/latex/bernoulli-monograph/book.html"
Source = "https://github.com/queelius/bernoulli/tree/main/bernoulli-py"
Issues = "https://github.com/queelius/bernoulli/issues"
Changelog = "https://github.com/queelius/bernoulli/blob/main/bernoulli-py/CHANGELOG.md"

[tool.hatch.version]
path = "src/bernoulli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bernoulli"]

[tool.hatch.build.targets.sdist]
# Leading slashes anchor the patterns to the project root (they are
# gitignore-style, so a bare "README.md" would also match notebooks/README.md).
include = [
  "/src/bernoulli",
  "/c",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/PHASING.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["N802", "N803"]  # framework uses uppercase NOT/AND/OR by intent

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bernoulli"]
