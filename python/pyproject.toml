[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bernoulli"
version = "0.1.0"
description = "The type, not the data structure: random approximate types in Python"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Alexander Towell", email = "lex@metafunctor.com" }
]
requires-python = ">=3.11"
keywords = [
  "bernoulli",
  "approximate-data-structures",
  "bloom-filter",
  "probabilistic-data-structures",
  "type-theory"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8.0",
  "pytest-cov >= 5.0",
  "ruff >= 0.6",
  "mypy >= 1.10"
]
notebooks = [
  "jupyter >= 1.0",
  "matplotlib >= 3.8"
]
numerics = [
  "numpy >= 1.26",
  "sympy >= 1.13"
]

[project.urls]
Homepage = "https://github.com/queelius/bernoulli/tree/main/python"
Documentation = "https://github.com/queelius/bernoulli/tree/main/book"
Source = "https://github.com/queelius/bernoulli/tree/main/python"
Issues = "https://github.com/queelius/bernoulli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bernoulli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
